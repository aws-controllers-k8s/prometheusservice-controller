ignore:
  resource_names: []
  field_paths:
    - CreateWorkspaceInput.ClientToken
    - CreateWorkspaceInput.KmsKeyArn
    - CreateWorkspaceOutput.KmsKeyArn
    - CreateRuleGroupsNamespaceInput.ClientToken
    - CreateRuleGroupsNamespaceInput.Data
    - CreateAlertManagerDefinitionInput.ClientToken
    - CreateAlertManagerDefinitionInput.Data
    - CreateLoggingConfigurationInput.ClientToken
    - CreateScraperInput.ClientToken
    # The scrape configuration is a base64 blob wrapped in a single-member union.
    # As with the rule groups and alert manager `data` fields above, we hide it and
    # expose a user-facing `configuration` string field instead, converting in hooks.
    # It must be ignored on every shape it appears in, or the read path still maps it.
    - CreateScraperInput.ScrapeConfiguration
    - UpdateScraperInput.ScrapeConfiguration
    - ScraperDescription.ScrapeConfiguration
  operations: null
resources:
  Workspace:
    fields:
      alias:
        print:
          name: ALIAS
      Tags:
        compare:
          is_ignored: True
    update_operation:
      custom_method_name: customUpdateWorkspace
    hooks:
      delta_pre_compare:
        code: customPreCompare(delta, a, b)
      sdk_create_post_set_output:
        template_path: hooks/workspace/sdk_create_post_set_output.go.tpl
  RuleGroupsNamespace:
    shortNames:
      - rgn
    fields:
      Name:
        is_immutable: true
      WorkspaceID:
        is_immutable: true
        print:
          name: WORKSPACE-ID   
        references:
          resource: Workspace
          path: Status.WorkspaceID
      Tags:
        compare:
          is_ignored: True
      # The data field is of type byte because the API expects a base64 string of the rule groups yaml configuration.
      # However, instead of the user providing a base64 encoding, they should provide a regular (multiline) 
      # string field and have the controller convert it to base64. This will make the CR's easier to use. 
      # Hence, we create a new field that takes in a string for the configuration. The user will use the `configuration` 
      # field instead of the `data` field to input the desired rule groups config. We have to manually handle 
      # the create/read/update for the new field and also the `data` field which is not going to be 
      # user facing.
      configuration:
        type: "string"
        is_required: True
    update_operation:
      custom_method_name: customUpdateRuleGroupsNamespace
    hooks:
        delta_pre_compare:
          code: customPreCompare(delta, a, b)
        sdk_create_post_build_request:
          template_path: hooks/rule_groups_namespace/sdk_create_post_build_request.go.tpl
        sdk_create_post_set_output:
          template_path: hooks/rule_groups_namespace/sdk_create_post_set_output.go.tpl
        sdk_read_one_pre_set_output:
          template_path: hooks/rule_groups_namespace/sdk_read_one_pre_set_output.go.tpl
    exceptions:
      terminal_codes:
        - ValidationException
  AlertManagerDefinition:
    tags:
      ignore: true
    fields:
      workspaceID:
        is_primary_key: true 
        is_immutable: true
        print:
          name: WORKSPACE-ID  
        references:
          resource: Workspace
          path: Status.WorkspaceID
      # Exact same issue with the data field as the rules group resource. Reasoning for a new field is 
      # the same as the explanation above. Instead of a base64 encoded byte slice, we expect a string and 
      # handle the conversion ourselves. The user will interact with the new `configuration` field 
      # instead of the `data` field. 
      configuration:
        type: "string"
        is_required: True
    update_operation:
      custom_method_name: customUpdateAlertManagerDefinition
    hooks:
      sdk_create_post_build_request:
        template_path: hooks/alert_manager_definition/sdk_create_post_build_request.go.tpl
      sdk_create_post_set_output:
        template_path: hooks/alert_manager_definition/sdk_create_post_set_output.go.tpl
      sdk_read_one_pre_set_output:
        template_path: hooks/alert_manager_definition/sdk_read_one_pre_set_output.go.tpl
      sdk_delete_pre_build_request:
        template_path: hooks/alert_manager_definition/sdk_delete_pre_build_request.go.tpl
    exceptions:
      terminal_codes:
        - ValidationException
  LoggingConfiguration:
    fields:
      WorkspaceID:
        is_immutable: true
        is_primary_key: true
        print:
          name: WORKSPACE-ID
        references:
          resource: Workspace
          path: Status.WorkspaceID
      LogGroupArn:
        is_required: true
        print:
          name: LOG-GROUP-ARN
    hooks:
      sdk_create_post_set_output:
        template_path: hooks/logging_configuration/sdk_create_post_set_output.go.tpl
      sdk_read_one_post_set_output:
        template_path: hooks/logging_configuration/sdk_read_one_post_set_output.go.tpl
    tags:
      ignore: true
  Scraper:
    fields:
      Alias:
        print:
          name: ALIAS
      # Same rationale as the rule groups and alert manager `configuration` fields:
      # the API takes a base64 blob, but users should supply plain YAML.
      configuration:
        type: "string"
        is_required: True
      Destination.AmpConfiguration.WorkspaceArn:
        references:
          resource: Workspace
          path: Status.ACKResourceMetadata.ARN
      Tags:
        custom_sync: {}
      # Only DescribeScraper returns these. RoleARN is the scraper's service-linked
      # role, which operators need when granting it access to the EKS cluster, and
      # StatusReason explains a CREATION_FAILED/UPDATE_FAILED scraper.
      RoleARN:
        is_read_only: true
        from:
          operation: DescribeScraper
          path: Scraper.RoleArn
      StatusReason:
        is_read_only: true
        from:
          operation: DescribeScraper
          path: Scraper.StatusReason
    hooks:
      sdk_create_post_build_request:
        template_path: hooks/scraper/sdk_create_post_build_request.go.tpl
      sdk_read_one_pre_set_output:
        template_path: hooks/scraper/sdk_read_one_pre_set_output.go.tpl
      sdk_update_pre_build_request:
        template_path: hooks/scraper/sdk_update_pre_build_request.go.tpl
      sdk_update_post_build_request:
        template_path: hooks/scraper/sdk_update_post_build_request.go.tpl
    exceptions:
      terminal_codes:
        - ValidationException
sdk_names:
  model_name: amp
  package_name: amp